<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">
  <title>Wiring: u-blox NEO-6M to Raspberry Pi CM4 (UART)</title>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2330">NEO-6M ↔ Raspberry Pi CM4 (UART)</text>

  <!-- NEO-6M -->
  <rect x="40" y="70" width="230" height="420" rx="10" fill="#e8f0fe" stroke="#1f6feb" stroke-width="2"/>
  <text x="155" y="100" text-anchor="middle" font-weight="700" fill="#1c2330">u-blox NEO-6M</text>
  <text x="155" y="120" text-anchor="middle" font-size="13" fill="#4a5568">(z. B. / e.g. GY-GPS6MV2)</text>
  <rect x="60" y="440" width="190" height="30" rx="5" fill="#fff" stroke="#9aa5b5"/>
  <text x="155" y="460" text-anchor="middle" font-size="13" fill="#4a5568">Antenne / antenna</text>
  <g fill="#1c2330">
    <circle cx="270" cy="160" r="7"/><text x="250" y="165" text-anchor="end">VCC</text>
    <circle cx="270" cy="230" r="7"/><text x="250" y="235" text-anchor="end">RX</text>
    <circle cx="270" cy="300" r="7"/><text x="250" y="305" text-anchor="end">TX</text>
    <circle cx="270" cy="370" r="7"/><text x="250" y="375" text-anchor="end">GND</text>
  </g>
  <circle cx="270" cy="415" r="7" fill="#ff7a00"/><text x="250" y="420" text-anchor="end" fill="#b34f00" font-weight="700">PPS</text>

  <!-- CM4 header -->
  <rect x="640" y="70" width="230" height="420" rx="10" fill="#e6f6ea" stroke="#1a7f37" stroke-width="2"/>
  <text x="755" y="100" text-anchor="middle" font-weight="700" fill="#1c2330">Raspberry Pi CM4</text>
  <text x="755" y="120" text-anchor="middle" font-size="13" fill="#4a5568">IO board · 40-pin header</text>
  <g fill="#1c2330">
    <circle cx="640" cy="160" r="7"/><text x="660" y="165">Pin 1 · 3V3</text>
    <circle cx="640" cy="230" r="7"/><text x="660" y="235">Pin 8 · GPIO14 (TXD)</text>
    <circle cx="640" cy="300" r="7"/><text x="660" y="305">Pin 10 · GPIO15 (RXD)</text>
    <circle cx="640" cy="370" r="7"/><text x="660" y="375">Pin 6 · GND</text>
  </g>
  <text x="755" y="440" text-anchor="middle" font-size="13" fill="#4a5568">/dev/ttyAMA0</text>
  <text x="755" y="460" text-anchor="middle" font-size="12" fill="#4a5568">enable_uart=1 · disable-bt</text>

  <!-- wires -->
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="277" y1="160" x2="633" y2="160" stroke="#d1242f"/>
    <line x1="277" y1="230" x2="633" y2="230" stroke="#0969da"/>
    <line x1="277" y1="300" x2="633" y2="300" stroke="#1a7f37"/>
    <line x1="277" y1="370" x2="633" y2="370" stroke="#24292f"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="455" y="150" fill="#d1242f" font-weight="700">VCC → 3.3 V (not 5 V!)</text>
    <text x="455" y="220" fill="#0969da">RX ← TXD</text>
    <text x="455" y="290" fill="#1a7f37">TX → RXD</text>
    <text x="455" y="360" fill="#24292f">GND — GND</text>
  </g>

  <!-- PPS out -->
  <path d="M277 415 L330 415" stroke="#ff7a00" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round"/>
  <text x="345" y="411" fill="#b34f00" font-weight="700">PPS → I210 SDP1</text>
  <text x="345" y="431" font-size="13" fill="#4a5568">nicht zum Pi / not to the Pi</text>
  <text x="345" y="449" font-size="12" fill="#4a5568">siehe / see wiring-pps-i210.svg</text>

  <rect x="40" y="510" width="830" height="34" rx="6" fill="#fff8e1" stroke="#e0b100"/>
  <text x="455" y="532" text-anchor="middle" font-size="14" fill="#5c4a00">3,3-V-Pegel überall / 3.3 V logic everywhere. TX und RX werden gekreuzt / TX and RX are crossed.</text>
</svg>
