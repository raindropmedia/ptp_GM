<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">
  <title>Wiring: GPS PPS to Intel I210 SDP1</title>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2330">GPS-PPS → Intel I210 (SDP1) / GPS PPS → Intel I210 (SDP1)</text>

  <!-- NEO-6M -->
  <rect x="30" y="80" width="190" height="400" rx="10" fill="#e8f0fe" stroke="#1f6feb" stroke-width="2"/>
  <text x="125" y="110" text-anchor="middle" font-weight="700" fill="#1c2330">NEO-6M</text>
  <text x="125" y="130" text-anchor="middle" font-size="13" fill="#4a5568">PPS: 1 Hz, 100 ms, 3.3 V</text>
  <circle cx="220" cy="200" r="7" fill="#ff7a00"/><text x="200" y="205" text-anchor="end" fill="#b34f00" font-weight="700">PPS</text>
  <circle cx="220" cy="400" r="7" fill="#24292f"/><text x="200" y="405" text-anchor="end" fill="#1c2330">GND</text>
  <text x="125" y="440" text-anchor="middle" font-size="12" fill="#4a5568">PPS-Pad / LED-Vorwiderstand</text>
  <text x="125" y="456" text-anchor="middle" font-size="12" fill="#4a5568">PPS pad / LED resistor</text>

  <!-- I210 card -->
  <rect x="330" y="80" width="300" height="400" rx="10" fill="#fff4e5" stroke="#d4731a" stroke-width="2"/>
  <text x="480" y="110" text-anchor="middle" font-weight="700" fill="#1c2330">Intel I210 (I210-T1)</text>
  <text x="480" y="130" text-anchor="middle" font-size="12" fill="#4a5568">SDP-Pads (Lage je nach Karte / varies by card)</text>
  <g fill="#1c2330">
    <circle cx="330" cy="170" r="7"/><text x="350" y="175">SDP0</text>
    <circle cx="330" cy="215" r="9" fill="#ff7a00"/><text x="350" y="220" font-weight="700" fill="#b34f00">SDP1  ← PPS (ts2phc pin 1)</text>
    <circle cx="330" cy="260" r="7"/><text x="350" y="265">SDP2</text>
    <circle cx="330" cy="305" r="7"/><text x="350" y="310">SDP3</text>
    <circle cx="330" cy="400" r="7" fill="#24292f"/><text x="350" y="405">GND</text>
  </g>
  <text x="480" y="455" text-anchor="middle" font-size="13" fill="#4a5568">PHC: /dev/ptp1 · eth1 (igb)</text>

  <!-- CM4 -->
  <rect x="740" y="80" width="190" height="400" rx="10" fill="#e6f6ea" stroke="#1a7f37" stroke-width="2"/>
  <text x="835" y="110" text-anchor="middle" font-weight="700" fill="#1c2330">Raspberry Pi CM4</text>
  <text x="835" y="130" text-anchor="middle" font-size="13" fill="#4a5568">IO board</text>
  <circle cx="740" cy="170" r="7" fill="#1c2330"/><text x="760" y="175" font-size="13">Pin 12 · GPIO18</text>
  <text x="835" y="455" text-anchor="middle" font-size="13" fill="#4a5568">PCIe-x1-Steckplatz / slot</text>

  <!-- PCIe link -->
  <line x1="630" y1="330" x2="740" y2="330" stroke="#6e40c9" stroke-width="10" stroke-linecap="round"/>
  <text x="685" y="318" text-anchor="middle" font-size="13" fill="#6e40c9" font-weight="700">PCIe x1</text>

  <!-- wires -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M227 200 L300 200 L300 215 L321 215" stroke="#ff7a00"/>
    <path d="M227 400 L321 400" stroke="#24292f"/>
    <path d="M330 170 L290 170 L290 66 L700 66 L700 170 L733 170" stroke="#8b949e" stroke-dasharray="9 7"/>
  </g>
    <text x="270" y="190" text-anchor="middle" font-size="13" fill="#b34f00" font-weight="700">PPS</text>
  <text x="270" y="420" text-anchor="middle" font-size="13" fill="#24292f">GND</text>

  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#57606a">gestrichelt: optional SDP0 ⇢ GPIO18 (von ptp-gm nicht genutzt) / dashed: optional, not used by ptp-gm</text>
  <rect x="30" y="510" width="900" height="64" rx="6" fill="#fff8e1" stroke="#e0b100"/>
  <text x="480" y="534" text-anchor="middle" font-size="14" fill="#5c4a00">Die I210 stempelt beide PPS-Flanken: ts2phc braucht Flanke „both“ und Pulsbreite 100 ms.</text>
  <text x="480" y="556" text-anchor="middle" font-size="14" fill="#5c4a00">The I210 timestamps both PPS edges: ts2phc needs polarity "both" and pulse width 100 ms.</text>
</svg>
